{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2>Recipe Details</h2>
<h3>{{name}} by {{author}}</h2>
  {% for image in images %}
  {% if image %}
  <img src="{{ image.image.url }}" alt="{{ image.image.description }}">
  {% endif %} {% endfor %}
  <ul>
    {% for ingredient in ingredients %}
    <li>{{ingredient}}</li>
    {% endfor %}
  </ul>
  {% endblock %}
