{% extends 'base.html' %}

{% block content %}
<h2>Upload Recipe Image</h2>
<p>{{ recipe.name }}</p>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Upload Image</button>
</form>

<a href="{{recipe.get_absolute_url}}">
  Go back to recipe
</a>
{% endblock %}
